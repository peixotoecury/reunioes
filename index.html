<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reuniões P&amp;C</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230E2841%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%2300AEEF%22 font-family=%22Trebuchet MS%22 font-weight=%22700%22%3EPC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: capa navy do template P&C no topo (logo branco à direita, linha cyan), corpo azul-lavanda com abas Painel / Calendário / Encaminhamentos / Reuniões; reunião com linha do tempo da pauta e modo apresentação em tela cheia */
:root{
  --bg1:#EEF3FB; --bg2:#ECE9F7; --surface:#FFFFFF; --surface2:#F2F5FA; --fg:#0E2841; --muted:#56667C; --line:#DCE3EE;
  --navy:#0E2841; --navy2:#16365C; --cyan:#009DDC; --cyan-soft:#DDF1FA; --on-cyan:#FFFFFF; --on-navy:#FFFFFF; --navy-muted:#A9C7E2;
  --t-cliente:#009DDC; --t-interna:#6250D6; --t-socios:#C98500; --t-fornecedor:#1BAF7A;
  --good:#1E7A3E; --good-soft:#E3F2E8; --warn:#A8690B; --warn-soft:#FCF0D9; --crit:#C0392B; --crit-soft:#FAE3E0;
  --font:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#0A1424; --bg2:#141331; --surface:#112038; --surface2:#172A45; --fg:#E6EDF6; --muted:#9AAAC0; --line:#24395A;
  --navy:#06101F; --navy2:#0E2340; --cyan:#33B5E8; --cyan-soft:#0F3550; --on-cyan:#06101F; --on-navy:#E6EDF6; --navy-muted:#8FB2D3;
  --t-cliente:#33B5E8; --t-interna:#9085E9; --t-socios:#E0A11A; --t-fornecedor:#27C28A;
  --good:#4CC38A; --good-soft:#123326; --warn:#E8B04B; --warn-soft:#3A2D10; --crit:#EF6F63; --crit-soft:#3D1A17;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg1:#0A1424; --bg2:#141331; --surface:#112038; --surface2:#172A45; --fg:#E6EDF6; --muted:#9AAAC0; --line:#24395A;
  --navy:#06101F; --navy2:#0E2340; --cyan:#33B5E8; --cyan-soft:#0F3550; --on-cyan:#06101F; --on-navy:#E6EDF6; --navy-muted:#8FB2D3;
  --t-cliente:#33B5E8; --t-interna:#9085E9; --t-socios:#E0A11A; --t-fornecedor:#27C28A;
  --good:#4CC38A; --good-soft:#123326; --warn:#E8B04B; --warn-soft:#3A2D10; --crit:#EF6F63; --crit-soft:#3D1A17;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);background-color:var(--bg1);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* capa */
header.capa{background:radial-gradient(circle at 85% -40%,var(--navy2) 0%,var(--navy) 60%);color:var(--on-navy);border-bottom:4px solid var(--cyan)}
header .topo{padding-block:22px 10px;display:flex;align-items:center;gap:18px}
header .tt{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:700}
header h1{margin:2px 0 0;font-size:clamp(26px,3.6vw,38px);font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--navy-muted);font-size:14px;margin-top:2px}
header .logo{height:64px;width:auto;flex:none}
nav.abas{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav.abas button{font:700 14px var(--font);color:var(--on-navy);opacity:.7;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.abas button[aria-selected="true"]{opacity:1;border-bottom-color:var(--cyan)}
nav.abas .badge{background:var(--crit);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
nav.abas .grow{flex:1}
nav.abas .nova{opacity:1;background:var(--cyan);color:var(--on-cyan);border-radius:6px;border:0;margin:4px 0}
main{flex:1}
main>.wrap{padding-block:20px 36px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:20px;text-wrap:balance}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.nota{font-size:13px;color:var(--muted)}
.vazio{padding:26px 8px;color:var(--muted);text-align:center}
.btn{font:700 14px var(--font);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:var(--on-cyan)}
.btn.claro{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--on-navy)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn.ia{border-color:var(--t-interna);color:var(--t-interna)}
.btn:disabled{opacity:.5;cursor:default}
:is(.btn,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.linkb{background:none;border:0;color:var(--muted);font:13px var(--font);cursor:pointer;padding:2px 4px}
.linkb.danger{color:var(--crit)}
.voltar{background:none;border:0;color:var(--cyan);font:700 14px var(--font);cursor:pointer;padding:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.crit i{background:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.warn i{background:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.good i{background:var(--good)}
.pill.info{background:var(--cyan-soft);color:var(--fg)}.pill.info i{background:var(--cyan)}
.pill.live{background:var(--crit-soft);color:var(--crit)}.pill.live i{background:var(--crit);animation:pulsa 1.6s infinite}
.tipo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.tipo i{width:9px;height:9px;border-radius:2px}
@keyframes pulsa{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.live i{animation:none}}
.avs{display:flex}
.avs .av{margin-left:-6px;border:2px solid var(--surface)}
.avs .av:first-child{margin-left:0}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none;position:relative}
.av.lg{width:36px;height:36px;font-size:13px}
.av.ap{outline:3px solid var(--cyan);outline-offset:1px}
.av .mao{position:absolute;right:-6px;top:-8px;font-size:14px}
.mais{background:var(--surface2);color:var(--muted)}
/* destaque próxima reunião */
.proxima{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:var(--on-navy);border:0;position:relative;overflow:hidden}
.proxima::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid var(--cyan);opacity:.18}
.proxima .eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.proxima h2{font-size:26px;margin:4px 0}
.proxima .meta{color:var(--navy-muted);font-size:14px}
.cont{display:flex;gap:10px;margin:14px 0}
.cont div{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;text-align:center;min-width:64px}
.cont b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.cont span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-muted)}
.proxima ol{margin:0 0 14px;padding-left:20px;color:var(--on-navy);font-size:14px}
.proxima .avs .av{border-color:var(--navy)}
/* KPIs */
.kpi .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.15}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--cyan)}
.kpi.alerta{border-top-color:var(--crit)}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
svg text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.colunas{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:6px;border-bottom:1px solid var(--line);margin-bottom:24px}
.colunas .cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.colunas .cb b{font-size:13px}
.colunas .br{width:min(36px,70%);background:var(--cyan);border-radius:4px 4px 0 0;min-height:2px}
.colunas small{font-size:12px;color:var(--muted);margin-bottom:-22px;height:18px}
.hbar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 30px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:12px;background:var(--surface2);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--cyan);border-radius:0 3px 3px 0}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
/* cartões de reunião */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.rc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(14,40,65,.12)}
@media (prefers-reduced-motion:reduce){.rc{transition:none}.rc:hover{transform:none}}
.rc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,var(--cyan))}
.rc .d{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rc .t{font-weight:700;font-size:16px;line-height:1.3}
.rc .prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rc .prog i{display:block;height:100%;background:var(--good)}
.rc .pe{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .h{background:var(--surface2);text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0}
.cal .dia{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .dia.fora{background:var(--surface2)}
.cal .dia.fora .n{opacity:.45}
.cal .dia .n{font-size:13px;font-weight:700;color:var(--muted)}
.cal .dia.hoje .n{background:var(--cyan);color:var(--on-cyan);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{font:12px var(--font);text-align:left;border:0;border-left:3px solid var(--tc,var(--cyan));background:var(--surface2);color:var(--fg);border-radius:4px;padding:3px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev b{font-weight:700}
/* quadro */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col.alvo{outline:2px dashed var(--cyan)}
.col .ch{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.col .ch span{background:var(--surface);border-radius:10px;padding:0 9px;font-size:13px;color:var(--muted)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.tk.atras{border-left:4px solid var(--crit)}
.tk .t{font-weight:700;line-height:1.35}
.tk .m{font-size:12px;color:var(--muted)}
.tk .m button{font:inherit;color:var(--cyan);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.tk .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.tk .mv{display:flex;gap:4px}
/* encaminhamento em lista */
.enc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.enc input[type=checkbox]{width:18px;height:18px;accent-color:var(--cyan)}
.enc .t{font-weight:700}
.enc.feito .t{text-decoration:line-through;color:var(--muted)}
.enc .m{font-size:13px;color:var(--muted)}
.enc .m button{font:inherit;color:var(--cyan);background:none;border:0;padding:0;cursor:pointer}
.addenc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 150px auto;gap:8px;margin-bottom:6px}
/* tabela de reuniões */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:700 13px var(--font);background:none;color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cyan-soft);color:var(--fg)}
/* formulário */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.form .s1{grid-column:span 1}.form .s2{grid-column:span 2}.form .s3{grid-column:span 3}.form .s6{grid-column:span 6}
.modelos{display:flex;gap:8px;flex-wrap:wrap}
.modelos button{font:13px var(--font);border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:16px;padding:5px 12px;cursor:pointer}
.itens{display:flex;flex-direction:column;gap:8px}
.itens .it{display:grid;grid-template-columns:28px minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.itens .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--cyan-soft);color:var(--fg)}
/* reunião */
.rhead{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:var(--on-navy);border:0;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc,var(--cyan))}
.rhead .l1{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rhead .rinfo{flex:1;min-width:0}
.rhead h2{font-size:26px;margin:2px 0 4px}
.rhead .meta{color:var(--navy-muted);font-size:14px}
.rhead .acoes{display:flex;gap:8px;flex-wrap:wrap}
.rhead .avs .av{border-color:var(--navy)}
.linha{display:flex;gap:4px;align-items:stretch}
.linha button{flex:var(--w,1);min-width:44px;background:rgba(255,255,255,.08);border:0;border-radius:6px;padding:8px 10px;text-align:left;color:var(--on-navy);cursor:pointer;font:13px var(--font);display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative}
.linha button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha button small{color:var(--navy-muted);font-size:11px}
.linha button[aria-current="true"]{background:var(--cyan);color:var(--on-cyan)}
.linha button[aria-current="true"] small{color:var(--on-cyan);opacity:.8}
.linha button.feito{background:rgba(255,255,255,.18)}
.linha button .ao{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--crit);animation:pulsa 1.6s infinite}
.barra{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.barra .peers{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.seguir{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.sub-abas{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.sub-abas button{font:700 14px var(--font);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.sub-abas button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--cyan)}
.sub-abas .cnt{background:var(--surface2);border-radius:9px;font-size:11px;padding:0 7px;color:var(--muted)}
.duas{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.salvo{font-size:12px;color:var(--muted)}
.dec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.dec .ic{width:26px;height:26px;border-radius:6px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-weight:700}
.dec .m{font-size:12px;color:var(--muted)}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sug .s{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px dashed var(--t-interna);border-radius:8px;padding:8px 10px}
.sug .s b{display:block}
.iabox{border:1px solid var(--t-interna);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.iabox .eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t-interna);font-weight:700;margin-bottom:4px}
.reacts{display:flex;gap:6px}
.reacts button{font-size:18px;padding:4px 9px;border:1px solid var(--line);background:var(--surface2);border-radius:7px;cursor:pointer}
/* modo apresentação */
.apres{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 80% -20%,var(--navy2) 0%,var(--navy) 65%);color:var(--on-navy);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));gap:18px;overflow:auto}
.apres .top{display:flex;align-items:center;gap:14px}
.apres .top .logo{height:44px}
.apres .top .tt{flex:1;min-width:0;color:var(--navy-muted);font-size:14px}
.apres .top .tt b{color:var(--on-navy);font-size:16px;display:block}
.apres .mid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:center}
.apres .num{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.apres h2{font-size:clamp(30px,5vw,58px);line-height:1.1;margin:8px 0 16px}
.apres .notas{font-size:clamp(16px,1.6vw,20px);color:var(--navy-muted);white-space:pre-wrap;max-width:62ch}
.apres .ring{text-align:center}
.apres .ring svg text{fill:var(--on-navy)}
.apres .prox{color:var(--navy-muted);font-size:14px;margin-top:10px}
.apres .bot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apres .pontos{display:flex;gap:6px;flex:1;justify-content:center}
.apres .pontos i{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.apres .pontos i.on{background:var(--cyan)}
.apres .pontos i.ok{background:rgba(255,255,255,.55)}
.floaty{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:32px;pointer-events:none;animation:sobe 2.4s ease-out forwards;z-index:30}
@keyframes sobe{from{transform:translateY(0);opacity:1}to{transform:translateY(-280px);opacity:0}}
@media (prefers-reduced-motion:reduce){.floaty{animation:none;opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:9px 16px;border-radius:7px;font-size:14px;z-index:40;max-width:90vw}
footer{background:var(--navy);border-top:4px solid var(--cyan);color:#FFFFFF}
footer .wrap{padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
footer span{opacity:.85}
@media (max-width:980px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.duas{grid-template-columns:minmax(0,1fr)}.apres .mid{grid-template-columns:minmax(0,1fr)}.form .s1,.form .s2,.form .s3{grid-column:span 3}}
@media (max-width:700px){.kanban{grid-template-columns:minmax(0,1fr)}.cal .dia{min-height:70px}.cal .ev span{display:none}.linha button small{display:none}}
@media (max-width:560px){.c3{grid-column:span 12}header .logo{height:44px}.addenc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form .s1,.form .s2,.form .s3{grid-column:span 6}.itens .it{grid-template-columns:28px minmax(0,1fr) 70px auto}}
/* senha */
#pwGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 80% -20%,#16365C 0%,#0E2841 65%);padding:16px}
html.gate-open #pwGate{display:none}
.gate-card{background:#fff;border-radius:14px;padding:32px 34px;width:min(360px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;color:#0E2841;font-family:var(--font)}
.gate-card img{height:58px;margin-bottom:10px}
.gate-card h2{font-size:18px;margin:4px 0}
.gate-card p{font-size:13px;color:#56667C;margin:0 0 16px}
.gate-card input{width:100%;padding:10px 12px;border:1px solid #DCE3EE;border-radius:7px;font:15px var(--font);margin-bottom:10px;text-align:center;letter-spacing:2px;color:#0E2841;background:#fff}
.gate-card button{width:100%;padding:10px;border:0;border-radius:7px;background:#009DDC;color:#fff;font:700 14px var(--font);cursor:pointer}
.gate-err{color:#C0392B;font-size:12px;margin-top:10px;display:none}
.gate-err.show{display:block}
/* agenda do Outlook */
.cal .ev.ol{border-left-style:dashed;background:transparent;border:1px dashed var(--line);border-left:3px dashed var(--muted);color:var(--muted)}
.olrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.olrow .h{font-weight:700;font-variant-numeric:tabular-nums}
.olrow .h small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.olrow .t{font-weight:700}
.olrow .m{font-size:13px;color:var(--muted)}
.olselo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.olselo i{width:14px;height:14px;border-radius:3px;background:#0F6CBD;display:inline-block}
</style>
</head>

function statusPill(r){
  if(LIVE?.reuniaoId===r.id)return'<span class="pill live"><i></i>Ao vivo</span>';
  if(r.status==="realizada")return'<span class="pill good"><i></i>Realizada</span>';
  if(r.data&&dIso(r.data)<hoje())return'<span class="pill warn"><i></i>Ata pendente</span>';
  if(r.data===isoHoje())return'<span class="pill info"><i></i>Hoje</span>';
  return'<span class="pill info"><i></i>Agendada</span>';
}
function prazoPill(x){
  if(x.feito)return'<span class="pill good"><i></i>Feito</span>';
  if(!x.prazo)return'<span class="pill info"><i></i>Sem prazo</span>';
  const d=diasAte(x.prazo);
  if(d<0)return`<span class="pill crit"><i></i>Atrasado ${-d}d</span>`;
  if(d<=2)return`<span class="pill warn"><i></i>${d===0?"Vence hoje":d===1?"Vence amanhã":"Em 2 dias"}</span>`;
  return`<span class="pill info"><i></i>${dataBR(x.prazo,{day:"2-digit",month:"short"})}</span>`;
}

function ultimosMeses(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({k:x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"),l:x.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")})}return out}
function barrasMes(){

}

function contagem(px){const el=$("contagem");if(!el||!px)return;
  const alvo=new Date(px.data+"T"+(px.hora||"09:00")+":00");let s=Math.max(0,Math.floor((alvo-Date.now())/1000));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  el.innerHTML=s?[[d,d===1?"dia":"dias"],[h,h===1?"hora":"horas"],[m,"min"]].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join(""):'<div><b>Agora</b><span>em andamento</span></div>'}

function renderCal(){
  if(semDados())return;

  const m=V.mes,ini0=new Date(m.getFullYear(),m.getMonth(),1);const desl=(ini0.getDay()+6)%7;const start=new Date(ini0);start.setDate(1-desl);
  const dias=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);dias.push(d)}
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const ht=isoHoje();const doMes=R.filter(r=>(r.data||"").startsWith(iso(ini0).slice(0,7)));
  app.innerHTML=`<div class="card"><div class="toolbar" style="margin-bottom:12px"><button class="btn sm" id="ant" aria-label="Mês anterior">‹</button><h2 style="min-width:190px;text-align:center;text-transform:capitalize">${m.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h2><button class="btn sm" id="prox" aria-label="Próximo mês">›</button><button class="btn sm" id="hj">Hoje</button><span class="grow"></span>
    ${Object.keys(TIPOS).map(t=>`<span class="tipo"><i style="background:${tcor(t)}"></i>${t}</span>`).join("")}<span class="olselo"><i></i>Outlook (sem pauta)</span><span class="nota">${doMes.length} reuniões no mês</span></div>
    <div style="overflow-x:auto"><div class="cal" style="min-width:560px">${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>`<div class="h">${d}</div>`).join("")}
    ${dias.map(d=>{const k=iso(d);const evs=R.filter(r=>r.data===k).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
      return`<div class="dia ${d.getMonth()!==m.getMonth()?"fora":""} ${k===ht?"hoje":""}" data-dia="${k}"><span class="n">${d.getDate()}</span>${evs.map(r=>`<button class="ev" data-rid="${esc(r.id)}" style="--tc:${tcor(r.tipo)}" title="${esc(r.titulo)}"><b>${esc(r.hora||"")}</b> <span>${esc(r.titulo)}</span></button>`).join("")}${olDoDia(k).map(o=>`<button class="ev ol" data-ol="${esc(o.id)}" title="Outlook: ${esc(o.assunto||"")} · clique para criar a pauta"><b>${o.diaInteiro?"":esc((o.inicio||"").slice(11,16))}</b> <span>${esc(o.assunto||"(sem assunto)")}</span></button>`).join("")}</div>`}).join("")}</div></div>

  $("ant").onclick=()=>{V.mes=new Date(m.getFullYear(),m.getMonth()-1,1);renderCal()};
  $("prox").onclick=()=>{V.mes=new Date(m.getFullYear(),m.getMonth()+1,1);renderCal()};
  $("hj").onclick=()=>{V.mes=null;renderCal()};
  app.querySelectorAll(".ev[data-rid]").forEach(b=>b.onclick=e=>{e.stopPropagation();abrir(b.dataset.rid)});
  app.querySelectorAll(".ev[data-ol]").forEach(b=>b.onclick=e=>{e.stopPropagation();criarDeOutlook(b.dataset.ol)});
  if(podeEscrever)app.querySelectorAll("[data-dia]").forEach(d=>d.ondblclick=()=>{V.editando=null;V.novaData=d.dataset.dia;V.tela="form";render()});
}

function assinarReuniao(rid){
  if(!db||unsubR?.rid===rid)return;unsubR?.();N={};D=[];
  const a=db.collection("notas").where("reuniaoId","==",rid).onSnapshot(s=>{N={};s.docs.forEach(d=>{const x=d.data();N[x.itemId]=x});resolverNomes(Object.values(N).map(x=>x.editadoPor)).then(atualizarNota)},()=>{});
  const b=db.collection("decisoes").where("reuniaoId","==",rid).onSnapshot(s=>{D=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.em||0)-(y.em||0));if(V.tela==="reuniao"&&!digitando())renderReuniao();else contarSub()},()=>{});
  unsubR=()=>{a();b()};unsubR.rid=rid;
}
const souApresentador=()=>!!(LIVE?.apresentador&&LIVE.apresentador===meuId);
const aoVivoAqui=()=>!!(LIVE?.apresentador&&LIVE.reuniaoId===V.rid);
function contarSub(){if(V.tela==="ata")return renderAtaView();const r=reuniao();if(!r)return;const c={encs:E.filter(x=>x.reuniaoId===r.id).length,decisoes:D.length};Object.entries(c).forEach(([k,v])=>{const el=document.querySelector(`[data-sub="${k}"] .cnt`);if(el)el.textContent=v})}
function renderReuniao(){
  const r=reuniao();if(!r){V.tela="abas";return render()}
  const itens=r.pauta||[];const encs=E.filter(x=>x.reuniaoId===r.id);const total=itens.reduce((a,p)=>a+(p.min||0),0)||1;
  const idx=itens.findIndex(p=>p.id===V.item);
  app.innerHTML=`<div class="toolbar"><button class="voltar" id="voltar">← Voltar</button></div>
  <div class="card rhead" style="--tc:${tcor(r.tipo)}">
    <div class="l1"><div class="rinfo"><div class="toolbar"><span class="tipo" style="color:var(--navy-muted)"><i style="background:${tcor(r.tipo)}"></i>${esc(r.tipo||"")}</span>${statusPill(r)}</div>
      <h2>${esc(r.titulo)}</h2><div class="meta">${esc(r.cliente||"")}${r.cliente?" · ":""}${dataBR(r.data,{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}${r.hora?" às "+esc(r.hora):""}${r.local?" · "+esc(r.local):""} · ${total} min</div></div>
      ${avatares(r.participantes,6,true)}</div>
    <div class="acoes">
      <button class="btn pri" id="btn-apres">▶ Modo apresentação</button>
      ${admin?`<button class="btn claro" id="btn-live">${souApresentador()?"Encerrar ao vivo":aoVivoAqui()?"Assumir a apresentação":"● Iniciar ao vivo"}</button>`:""}
      ${podeEscrever?`<button class="btn claro" id="btn-status">${r.status==="realizada"?"Reabrir":"✓ Marcar como realizada"}</button><button class="btn claro" id="btn-editar">Editar</button>`:""}
      <button class="btn ${V.enviar?"pri":"claro"}" id="btn-enviar">✉ Enviar ata</button>
      ${downloads?'<button class="btn claro" id="btn-ata">Baixar ata</button>':""}
      ${podeEscrever?'<button class="btn claro" id="btn-excluir">Excluir</button>':""}
    </div>
    <div class="linha" role="tablist" aria-label="Linha do tempo da pauta">${itens.map((p,i)=>`<button data-item="${esc(p.id)}" style="--w:${Math.max(1,p.min||1)}" aria-current="${p.id===V.item}" class="${N[p.id]?.texto?"feito":""}" title="${esc(p.t)} · ${p.min||0} min"><span>${i+1}. ${esc(p.t)}</span><small>${p.min||0} min${N[p.id]?.texto?" · anotado":""}</small>${aoVivoAqui()&&LIVE.item===p.id?'<i class="ao"></i>':""}</button>`).join("")}</div>
  </div>
  ${room?`<div class="barra"><div class="peers" id="peers"></div><span class="timer" id="timer" ${aoVivoAqui()?"":"hidden"}>00:00</span>
    <label class="seguir" ${aoVivoAqui()&&!souApresentador()?"":"hidden"}><input type="checkbox" id="chk-seguir" ${V.seguir?"checked":""}> Seguir apresentação</label>
    <button class="btn sm" id="btn-mao">${V.mao?"✋ Baixar a mão":"✋ Levantar a mão"}</button>
    <div class="reacts" id="reacts"><button data-r="👍" aria-label="Concordo">👍</button><button data-r="❓" aria-label="Tenho dúvida">❓</button><button data-r="🎯" aria-label="Ponto importante">🎯</button><button data-r="👏" aria-label="Aplausos">👏</button></div></div>`:""}
  ${V.enviar?painelEnvio(r):""}
  <div class="sub-abas" role="tablist">${[["pauta","Pauta e anotações"],["encs","Encaminhamentos",encs.length],["decisoes","Decisões",D.length],["ata","Ata"]].map(([k,l,c])=>`<button role="tab" data-sub="${k}" aria-selected="${V.sub===k}">${l}${c!==undefined?`<span class="cnt">${c}</span>`:""}</button>`).join("")}</div>
  <div id="sub"></div>`;
  renderSub(r,itens,idx,encs);
  renderPeers();
  $("voltar").onclick=()=>{unsubR?.();unsubR=null;V.tela="abas";salvarNav();room?.presence({reuniao:null}).catch(()=>{});render()};
  app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{V.sub=b.dataset.sub;renderReuniao()});
  app.querySelectorAll(".linha [data-item]").forEach(b=>b.onclick=()=>escolherItem(b.dataset.item));
  $("btn-apres").onclick=()=>{V.apres=true;renderApres()};
  $("btn-editar")?.addEventListener("click",()=>{V.editando=r.id;V.tela="form";render()});
  $("btn-status")?.addEventListener("click",async()=>{try{await db.collection("reunioes").doc(r.id).update({status:r.status==="realizada"?"agendada":"realizada",atualizadoEm:Date.now()});toast(r.status==="realizada"?"Reunião reaberta":"Reunião marcada como realizada")}catch(e){toast("Não foi possível atualizar.")}});
  $("btn-excluir")?.addEventListener("click",async e=>{const b=e.currentTarget;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmar exclusão?";setTimeout(()=>{b.dataset.c="";b.textContent="Excluir"},3500);return}
    try{for(const x of encs)await db.collection("encaminhamentos").doc(x.id).delete();for(const x of D)await db.collection("decisoes").doc(x.id).delete();
      for(const p of itens)await db.doc("notas/"+r.id+"__"+p.id).delete();await db.collection("reunioes").doc(r.id).delete();toast("Reunião excluída");unsubR?.();unsubR=null;V.tela="abas";render()}catch(err){toast("Não foi possível excluir.")}});
  $("btn-ata")?.addEventListener("click",baixarAta);
  $("btn-enviar").onclick=()=>{V.enviar=!V.enviar;renderReuniao()};
  if(V.enviar)ligarEnvio(r);
  $("btn-live")?.addEventListener("click",alternarLive);
  $("chk-seguir")?.addEventListener("change",e=>{V.seguir=e.target.checked;if(V.seguir&&aoVivoAqui()&&LIVE.item)escolherItem(LIVE.item,true)});
  $("btn-mao")?.addEventListener("click",()=>{V.mao=!V.mao;$("btn-mao").textContent=V.mao?"✋ Baixar a mão":"✋ Levantar a mão";room.presence({mao:V.mao}).catch(()=>{});renderPeers()});
  $("reacts")?.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(b)reagir(b.dataset.r)});
}
function reagir(r){if(room?.connected())room.emit("reacao",{r,reuniao:V.rid}).catch(()=>reacao(r));else reacao(r)}
async function alternarLive(){const r=reuniao();const ref=db.doc("live/estado");
  try{if(souApresentador())await ref.set({reuniaoId:null,apresentador:null,item:null,inicio:null,itemInicio:null});
    else{await ref.set({reuniaoId:r.id,apresentador:meuId,item:V.item,inicio:aoVivoAqui()?LIVE.inicio:Date.now(),itemInicio:Date.now()});V.apres=true;renderApres()}}
  catch(e){toast("Só quem edita o painel pode apresentar.")}}
function escolherItem(id,doLive){
  V.item=id;
  if(!doLive&&souApresentador()&&aoVivoAqui())db.doc("live/estado").update({item:id,itemInicio:Date.now()}).catch(()=>toast("Não foi possível mudar o item para todos."));
  else if(!doLive&&aoVivoAqui()&&V.seguir){V.seguir=false;toast("Você saiu do modo seguir. Marque \"Seguir apresentação\" para voltar.")}
  room?.presence({item:V.item}).catch(()=>{});
  if(V.tela==="reuniao"){V.sub=V.sub==="ata"?"pauta":V.sub;renderReuniao()}
  if(V.apres)renderApres();
}
function renderSub(r,itens,idx,encs){
  const el=$("sub");
  if(V.sub==="pauta"){
    const it=itens[idx];const dItem=D.filter(x=>x.itemId===V.item);const eItem=encs.filter(x=>x.itemId===V.item);
    el.innerHTML=`<div class="duas"><div class="card"><div class="toolbar" style="margin-bottom:10px"><div class="grow"><div class="nota">Item ${idx+1} de ${itens.length} · ${it?.min||0} min previstos</div><h3 style="margin:0;font-size:20px">${esc(it?.t||"Sem itens")}</h3></div><span class="salvo" id="nota-salvo"></span></div>
      <textarea id="nota" rows="10" placeholder="${podeEscrever?"Anote o que foi discutido neste item: números citados, posições, dúvidas. Salva sozinho.":"Sem anotações."}" ${podeEscrever?"":"readonly"}></textarea>
      <div class="toolbar" style="margin-top:10px"><button class="btn sm" id="ant-item" ${idx<=0?"disabled":""}>← Item anterior</button><span class="grow"></span><button class="btn sm" id="prox-item" ${idx>=itens.length-1?"disabled":""}>Próximo item →</button></div></div>
      <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h3>Decisões deste item</h3>${dItem.map(decHTML).join("")||'<div class="nota">Nenhuma decisão registrada neste item.</div>'}
        ${podeEscrever?`<form class="toolbar" id="dec-form" style="margin-top:10px"><input type="text" id="dec-texto" placeholder="Registrar uma decisão" style="flex:1"><button class="btn sm pri">Registrar</button></form>`:""}</div>
      <div class="card"><h3>Encaminhamentos deste item</h3>${eItem.map(x=>encHTML(x)).join("")||'<div class="nota">Nenhum encaminhamento neste item.</div>'}
        ${podeEscrever?`<form class="addenc" id="enc-form" style="margin-top:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><input type="text" id="enc-texto" placeholder="O que ficou combinado" required style="grid-column:span 2"><input type="text" id="enc-resp" placeholder="Responsável" list="resps"><input type="date" id="enc-prazo" aria-label="Prazo"><button class="btn pri sm" style="grid-column:span 2">Adicionar encaminhamento</button></form>`:""}
        ${sample&&podeEscrever?`<button class="btn sm ia" id="btn-sug" style="margin-top:10px">✦ Sugerir encaminhamentos com IA</button><div class="sug" id="sug"></div>`:""}</div></div></div>
      <datalist id="resps">${[...new Set([...String(r.participantes||"").split(/[,;]/),...E.map(x=>x.responsavel)].map(s=>(s||"").trim()).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
    atualizarNota();
    $("ant-item").onclick=()=>escolherItem(itens[idx-1].id);$("prox-item").onclick=()=>escolherItem(itens[idx+1].id);
    const nota=$("nota");nota.oninput=()=>{$("nota-salvo").textContent="Salvando…";clearTimeout(nota.t);const iid=V.item,tx=nota.value;nota.t=setTimeout(()=>{nota.t=null;salvarNota(r.id,iid,tx)},800)};
    nota.onblur=()=>{if(nota.t){clearTimeout(nota.t);nota.t=null;salvarNota(r.id,V.item,nota.value)}};
    ligarForms(r);renderSug();
  }else if(V.sub==="encs"){
    el.innerHTML=`<div class="card">${podeEscrever?`<form class="addenc" id="enc-form"><input type="text" id="enc-texto" placeholder="O que ficou combinado" required><input type="text" id="enc-resp" placeholder="Responsável" list="resps"><input type="date" id="enc-prazo" aria-label="Prazo"><button class="btn pri">Adicionar</button></form>`:""}
      <div id="encs">${[...encs].sort((a,b)=>(a.feito-b.feito)||(a.prazo||"9").localeCompare(b.prazo||"9")).map(x=>encHTML(x,true)).join("")||'<div class="vazio">Nenhum encaminhamento nesta reunião.</div>'}</div></div>
      <datalist id="resps">${[...new Set(String(r.participantes||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
    ligarForms(r);
  }else if(V.sub==="decisoes"){
    el.innerHTML=`<div class="card">${D.length?itens.map((p,i)=>{const ds=D.filter(x=>x.itemId===p.id);return ds.length?`<h3 style="margin-top:8px">${i+1}. ${esc(p.t)}</h3>${ds.map(decHTML).join("")}`:""}).join("")+(D.filter(x=>!itens.some(p=>p.id===x.itemId)).map(decHTML).join("")):'<div class="vazio">Nenhuma decisão registrada. Registre as decisões dentro de cada item da pauta.</div>'}</div>`;
    ligarDec();
  }else{
    el.innerHTML=`<div class="duas"><div class="card"><div class="toolbar" style="margin-bottom:8px"><h3 class="grow" style="margin:0">Resumo da reunião</h3><span class="salvo" id="resumo-salvo"></span></div>
      ${sample&&podeEscrever?`<div class="iabox" style="margin-bottom:10px"><div class="eb">Claude</div><div class="toolbar"><span class="nota grow">Gera um resumo executivo a partir das anotações, decisões e encaminhamentos. Você revisa antes de salvar.</span><button class="btn sm ia" id="btn-ia">✦ Gerar resumo</button><button class="btn sm" id="btn-ia-parar" hidden>Parar</button></div></div>`:""}
      <textarea id="resumo" rows="14" placeholder="${podeEscrever?"Resumo executivo para a ata: principais pontos, decisões e próximos passos.":"Sem resumo."}" ${podeEscrever?"":"readonly"}>${esc(r.resumo)}</textarea></div>
      <div class="card"><h3>O que vai na ata</h3><div class="nota" style="display:flex;flex-direction:column;gap:6px">
        <span>✓ Dados da reunião e participantes</span><span>${Object.values(N).filter(n=>n.texto).length?"✓":"○"} Anotações de ${Object.values(N).filter(n=>n.texto).length} de ${itens.length} itens</span>
        <span>${D.length?"✓":"○"} ${D.length} decisões</span><span>${encs.length?"✓":"○"} ${encs.length} encaminhamentos</span><span>${r.resumo?"✓":"○"} Resumo</span></div>
        ${downloads?'<button class="btn pri" id="btn-ata2" style="margin-top:14px">Baixar ata</button>':""}</div></div>`;
    $("btn-ata2")?.addEventListener("click",baixarAta);
    const res=$("resumo");res.oninput=()=>{$("resumo-salvo").textContent="Salvando…";clearTimeout(res.t);res.t=setTimeout(()=>{res.t=null;salvarResumo(r.id,res.value)},900)};
    $("btn-ia")?.addEventListener("click",()=>gerarResumo(r));
  }
}
async function salvarResumo(rid,v){try{await db.collection("reunioes").doc(rid).update({resumo:v,atualizadoEm:Date.now()});const s=$("resumo-salvo");if(s)s.textContent="Salvo"}catch(e){const s=$("resumo-salvo");if(s)s.textContent="Não foi salvo"}}
function decHTML(x){return`<div class="dec"><span class="ic">✓</span><div><div>${esc(x.texto)}</div><div class="m">${esc(nm(x.criadoPor)||"")}${x.em?" · "+new Date(x.em).toLocaleDateString("pt-BR"):""}</div></div>${podeEscrever?`<button class="linkb" data-deldec="${esc(x.id)}">Remover</button>`:""}</div>`}
function ligarDec(){app.querySelectorAll("[data-deldec]").forEach(b=>b.onclick=async()=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmar?";b.classList.add("danger");setTimeout(()=>{b.dataset.c="";b.textContent="Remover";b.classList.remove("danger")},3000);return}
  try{await db.collection("decisoes").doc(b.dataset.deldec).delete()}catch(e){toast("Não foi possível remover.")}})}
function encHTML(x,comItem){const r=reuniao();const it=comItem&&r?.pauta?.find(p=>p.id===x.itemId);
  return`<div class="enc ${x.feito?"feito":""}" data-eid="${esc(x.id)}"><input type="checkbox" id="ck-${esc(x.id)}" ${x.feito?"checked":""} ${podeEscrever?"":"disabled"} aria-label="Marcar como concluído">
  <div style="min-width:0"><label class="t" for="ck-${esc(x.id)}">${esc(x.texto)}</label><div class="m">${esc(x.responsavel||"Sem responsável")}${it?" · item: "+esc(it.t):""}${x.andamento&&!x.feito?" · em andamento":""}${x.feito&&x.feitoPor?" · concluído por "+esc(nm(x.feitoPor)):""}</div></div>
  <div style="display:flex;gap:6px;align-items:center">${prazoPill(x)}${podeEscrever?`<button class="linkb" data-delenc="${esc(x.id)}">Remover</button>`:""}</div></div>`}
function ligarForms(r){
  const pz=$("enc-prazo");if(pz){const d=new Date();d.setDate(d.getDate()+7);pz.value=d.toISOString().slice(0,10)}
  $("enc-form")?.addEventListener("submit",async e=>{e.preventDefault();const t=$("enc-texto").value.trim();if(!t)return;
    try{await db.collection("encaminhamentos").add({reuniaoId:r.id,itemId:V.item,texto:t,responsavel:$("enc-resp").value.trim(),prazo:$("enc-prazo").value,feito:false,andamento:false,criadoPor:meuId,criadoEm:Date.now()});toast("Encaminhamento registrado")}
    catch(err){toast(err.code==="quota_exceeded"?"O espaço do painel está cheio.":"Você não tem permissão para registrar.")}});
  $("dec-form")?.addEventListener("submit",async e=>{e.preventDefault();const t=$("dec-texto").value.trim();if(!t)return;
    try{await db.collection("decisoes").add({reuniaoId:r.id,itemId:V.item,texto:t,criadoPor:meuId,em:Date.now()});toast("Decisão registrada")}catch(err){toast("Você não tem permissão para registrar.")}});
  app.querySelectorAll(".enc input[type=checkbox]").forEach(c=>c.onchange=async()=>{const id=c.closest("[data-eid]").dataset.eid;
    try{await db.collection("encaminhamentos").doc(id).update(c.checked?{feito:true,andamento:false,feitoPor:meuId,feitoEm:Date.now()}:{feito:false,feitoPor:null})}catch(err){c.checked=!c.checked;toast("Você não tem permissão para alterar.")}});
  app.querySelectorAll("[data-delenc]").forEach(b=>b.onclick=async()=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmar?";b.classList.add("danger");setTimeout(()=>{b.dataset.c="";b.textContent="Remover";b.classList.remove("danger")},3000);return}
    try{await db.collection("encaminhamentos").doc(b.dataset.delenc).delete();toast("Encaminhamento removido")}catch(e){toast("Não foi possível remover.")}});
  ligarDec();
  $("btn-sug")?.addEventListener("click",()=>sugerir(r));
}
async function salvarNota(rid,itemId,texto){if(!db||!itemId)return;
  try{await db.doc("notas/"+rid+"__"+itemId).set({reuniaoId:rid,itemId,texto,editadoPor:meuId,em:Date.now()});const s=$("nota-salvo");if(s&&V.item===itemId)s.textContent="Salvo agora"}
  catch(e){const s=$("nota-salvo");if(s)s.textContent="Não foi salvo"}}
function atualizarNota(){
  if(V.tela==="ata")return renderAtaView();
  if(V.apres)renderApres();
  const ta=$("nota");if(!ta)return;const n=N[V.item];
  if(document.activeElement!==ta&&!ta.t){ta.value=n?.texto||"";const s=$("nota-salvo");if(s)s.textContent=n?.em?`Editado por ${nm(n.editadoPor)} às ${new Date(n.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:""}
  document.querySelectorAll(".linha [data-item]").forEach(b=>{const t=!!N[b.dataset.item]?.texto;b.classList.toggle("feito",t)});
}

// ---------- IA (Claude) ----------
function contexto(r){const encs=E.filter(x=>x.reuniaoId===r.id);
  return`Reunião: ${r.titulo}\nCliente/área: ${r.cliente||"-"} | Tipo: ${r.tipo||"-"} | Data: ${dataBR(r.data)} ${r.hora||""}\nParticipantes: ${r.participantes||"-"}\n\nPauta e anotações:\n`+
  (r.pauta||[]).map((p,i)=>`${i+1}. ${p.t}\n   Anotações: ${(N[p.id]?.texto||"(sem anotações)").slice(0,3000)}\n   Decisões: ${D.filter(d=>d.itemId===p.id).map(d=>d.texto).join("; ")||"-"}`).join("\n")+
  `\n\nEncaminhamentos já registrados:\n${encs.map(x=>`- ${x.texto} (resp.: ${x.responsavel||"-"}; prazo: ${dataBR(x.prazo)||"-"})`).join("\n")||"- nenhum"}`}
const IAERR={not_granted:"Sem autorização para usar o Claude neste painel.",sampling_disabled:"O Claude não está disponível nesta conta.",rate_limited:"Muitos pedidos seguidos. Tente de novo em instantes.",refused:"O Claude não gerou esse conteúdo. Ajuste as anotações e tente de novo."};
let iaCtl=null;
async function gerarResumo(r){
  const ta=$("resumo");if(!ta)return;iaCtl?.abort();iaCtl=new AbortController();const antes=ta.value;
  $("btn-ia").disabled=true;$("btn-ia-parar").hidden=false;$("resumo-salvo").textContent="Claude está escrevendo…";
  try{const {text}=await sample(`Você é assistente de um escritório de advocacia (Peixoto & Cury Advogados). Escreva o resumo executivo da ata desta reunião em português do Brasil, em tom formal e objetivo, sem travessões, com no máximo 220 palavras. Estrutura: um parágrafo de contexto; depois "Principais pontos:" com tópicos "- "; depois "Decisões:" com tópicos; depois "Próximos passos:" com tópicos citando responsável e prazo quando houver. Use só o que está nos dados; não invente números.\n\n${contexto(r)}`,
      {signal:iaCtl.signal,cache:false,onText:({text})=>{ta.value=text}});
    ta.value=text;await salvarResumo(r.id,text);toast("Resumo gerado e salvo. Revise se quiser ajustar.")}
  catch(e){if(e.code==="cancelled"){if(e.text){ta.value=e.text;salvarResumo(r.id,e.text)}else ta.value=antes}else{ta.value=e.text||antes;toast(IAERR[e.code]||"Não foi possível gerar agora. Tente de novo.")}}
  finally{const b=$("btn-ia");if(b){b.disabled=false;$("btn-ia-parar").hidden=true}const s=$("resumo-salvo");if(s&&s.textContent.startsWith("Claude"))s.textContent=""}
}
document.addEventListener("click",e=>{if(e.target.id==="btn-ia-parar")iaCtl?.abort()});
async function sugerir(r){

function criarDB(sb){
  const cache={},subs={},carregando={};
  const notify=c=>(subs[c]||new Set()).forEach(f=>f());
  const snap=c=>({docs:[...(cache[c]||new Map())].map(([id,d])=>({id,exists:true,data:()=>d}))});
  function carregar(c){
    if(!carregando[c])carregando[c]=(async()=>{const {data,error}=await sb.from(TABELA).select("id,dados").eq("colecao",c);if(error)throw error;cache[c]=new Map(data.map(r=>[r.id,r.dados]));notify(c)})();
    return carregando[c];
  }
  sb.channel("dados-"+TABELA).on("postgres_changes",{event:"*",schema:"public",table:TABELA},p=>{
    const r=(p.new&&p.new.colecao)?p.new:p.old;if(!r||!r.colecao||!cache[r.colecao])return;
    if(p.eventType==="DELETE")cache[r.colecao].delete(r.id);else cache[r.colecao].set(r.id,p.new.dados);notify(r.colecao)}).subscribe();
  const erro=e=>{const x=new Error(e?.message||"erro");x.code=e?.code==="42501"?"sem_permissao":"falha";return x};
  async function gravar(c,id,dados){
    (cache[c]??=new Map()).set(id,dados);notify(c);
    const {error}=await sb.from(TABELA).upsert({colecao:c,id,dados,atualizado_em:new Date().toISOString()},{onConflict:"colecao,id"});
    if(error)throw erro(error);
  }
  function docRef(c,id){return{
    id,
    async set(d){await gravar(c,id,{...d})},
    async update(p){let atual=cache[c]?.get(id);
      if(!atual){const {data}=await sb.from(TABELA).select("dados").eq("colecao",c).eq("id",id).maybeSingle();atual=data?.dados;if(!atual)throw erro({message:"não existe"})}
      const novo={...atual};for(const k in p){if(p[k]===undefined)continue;novo[k]=p[k]}await gravar(c,id,novo)},
    async delete(){cache[c]?.delete(id);notify(c);const {error}=await sb.from(TABELA).delete().eq("colecao",c).eq("id",id);if(error)throw erro(error)},
    onSnapshot(cb,err){const f=()=>{const d=cache[c]?.get(id);cb({id,exists:!!d,data:()=>d})};(subs[c]??=new Set()).add(f);carregar(c).then(f).catch(e=>err&&err(e));return()=>subs[c].delete(f)},
  }}
  function colecao(c,filtros=[]){return{
    where(campo,op,valor){return colecao(c,[...filtros,[campo,valor]])},
    doc(id){return docRef(c,id||("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)))},
    async add(d){const r=this.doc();await r.set(d);return r},
    onSnapshot(cb,err){const f=()=>{const s=snap(c);if(filtros.length)s.docs=s.docs.filter(x=>filtros.every(([k,v])=>x.data()?.[k]===v));cb(s)};
      (subs[c]??=new Set()).add(f);carregar(c).then(f).catch(e=>err&&err(e));return()=>subs[c].delete(f)},
  }}
  return{collection:c=>colecao(c),doc:path=>{const [c,id]=path.split("/");return docRef(c,id)}};
}

function criarSala(sb,nome){
  const peer=Math.random().toString(36).slice(2,10);let estado={},conectado=false,lista=[];const ons={},peerSubs=new Set(),connSubs=new Set();
  const ch=sb.channel("sala-reunioes-pc",{config:{presence:{key:peer},broadcast:{self:true}}});
  ch.on("presence",{event:"sync"},()=>{const st=ch.presenceState();
    lista=Object.entries(st).map(([k,arr])=>{const p=arr[arr.length-1]||{};return{peer:k,by:p.nome||null,isMe:k===peer,sameTab:k===peer,kind:"viewer",guest:false,presence:p.estado||{}}});
    peerSubs.forEach(f=>f({peers:lista}))});
  ch.on("broadcast",{event:"msg"},({payload})=>{if(!payload)return;(ons[payload.topic]||[]).forEach(f=>f({topic:payload.topic,data:payload.data,peer:payload.peer,by:payload.nome,sameTab:payload.peer===peer,isMe:payload.peer===peer}))});
  ch.subscribe(s=>{conectado=s==="SUBSCRIBED";connSubs.forEach(f=>f(conectado));if(conectado)ch.track({nome,estado}).catch(()=>{})});
  return{
    peers:()=>lista,
    onPeers(f){peerSubs.add(f);return()=>peerSubs.delete(f)},
    onConnection(f){connSubs.add(f);return()=>connSubs.delete(f)},
    on(t,f){(ons[t]??=[]).push(f);return()=>{ons[t]=ons[t].filter(x=>x!==f)}},

    connected:()=>conectado,
  };
}

  room.presence({reuniao:null,item:null,mao:false}).catch(()=>{});
}

// ---------- agenda do Outlook (sincronizada pelo script sincronizar_outlook.py) ----------
const olVinculada=o=>R.find(r=>r.outlookId===o.id);
const olDoDia=k=>O.filter(o=>(o.inicio||"").slice(0,10)===k&&!olVinculada(o)).sort((a,b)=>(a.inicio||"").localeCompare(b.inicio||""));
function olQuando(){const m=OM.map(x=>x.em).filter(Boolean).sort().pop();if(!m)return"";const d=new Date(m);return`Outlook sincronizado ${d.toLocaleDateString("pt-BR")===new Date().toLocaleDateString("pt-BR")?"hoje":"em "+d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`}
function criarDeOutlook(id){const o=O.find(x=>x.id===id);if(!o)return;const vin=olVinculada(o);if(vin)return abrir(vin.id);
  V.prefill={titulo:o.assunto||"",data:(o.inicio||"").slice(0,10),hora:o.diaInteiro?"":(o.inicio||"").slice(11,16),local:o.local||"",participantes:o.participantes||"",emails:o.emails||"",outlookId:o.id};
  V.editando=null;V.tela="form";render();window.scrollTo(0,0)}
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function cardOutlook(){
  const passadas=V.olModo==="passadas";const ht=isoHoje();const ref=new Date();ref.setDate(ref.getDate()+(passadas?-7:7));const limIso=isoLocal(ref);
  const agoraIso=isoLocal(new Date())+"T"+new Date().toTimeString().slice(0,5);
  const lista=O.filter(o=>{const d=(o.inicio||"").slice(0,10);return passadas?(d>=limIso&&(o.inicio||"")<agoraIso):(d>=ht&&d<=limIso&&(o.fim||o.inicio||"")>=agoraIso)})
    .sort((a,b)=>passadas?(b.inicio||"").localeCompare(a.inicio||""):(a.inicio||"").localeCompare(b.inicio||"")).slice(0,60);
  const quando=olQuando();let dia="";
  return`<div class="card"><div class="toolbar" style="margin-bottom:6px"><h2 class="grow"><span class="olselo" style="font-size:20px;color:var(--fg)"><i></i>Sua agenda do Outlook</span></h2>
    <div class="seg" role="group" aria-label="Período"><button data-olm="prox" aria-pressed="${!passadas}">Próximos 7 dias</button><button data-olm="passadas" aria-pressed="${passadas}">Últimos 7 dias</button></div>
    <span class="nota">${quando||"Ainda não sincronizado. Rode o sincronizar_outlook.py no computador."}</span></div>
    ${passadas?'<p class="nota" style="margin:0 0 4px">Reuniões que já aconteceram: clique em "Registrar ata" para guardar o que foi falado e os encaminhamentos.</p>':""}
    ${lista.length?lista.map(o=>{const vin=olVinculada(o);const d=new Date(o.inicio);const k=(o.inicio||"").slice(0,10);
      const cab=k!==dia?(dia=k,`<div class="nota" style="margin-top:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">${k===ht?"Hoje":d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</div>`):"";
      return`${cab}<div class="olrow"><div class="h">${o.diaInteiro?"Dia todo":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>
      <div style="min-width:0"><div class="t">${esc(o.assunto||"(sem assunto)")}</div><div class="m">${esc([o.local,o.organizador&&("org. "+o.organizador)].filter(Boolean).join(" · "))}</div></div>
      <button class="btn sm ${vin?"":"pri"}" data-ol="${esc(o.id)}">${vin?(vin.status==="realizada"?"Ver ata":"Abrir reunião"):(passadas?"Registrar ata":"Criar pauta")}</button></div>`}).join(""):`<div class="vazio">${quando?(passadas?"Nenhum compromisso nos últimos 7 dias.":"Nada na agenda nos próximos 7 dias."):"Quando o script do Outlook rodar, seus compromissos aparecem aqui para virar pauta com um clique."}</div>`}</div>`;
}

// ---------- envio da ata ----------
let CFG={};
const baseUrl=()=>location.origin+location.pathname;
const linkAta=r=>baseUrl()+"#ata-"+r.id;
const listaEmails=t=>String(t||"").split(/[;,\s]+/).map(x=>x.trim()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
function destinatarios(r){const m=new Map();[...listaEmails(r.emails),...listaEmails(CFG.emailsFixos)].forEach(e=>m.set(e.toLowerCase(),e));return[...m.values()]}
function textoAta(r){const encs=E.filter(x=>x.reuniaoId===r.id);
  const linhas=[`Ata da reunião: ${r.titulo}`,`${dataBR(r.data)}${r.hora?" às "+r.hora:""}${r.cliente?" · "+r.cliente:""}`,`Participantes: ${r.participantes||"não informados"}`,""];
  if(r.resumo)linhas.push("RESUMO",r.resumo.trim(),"");
  if(D.length)linhas.push("DECISÕES",...D.map(d=>"- "+d.texto),"");
  if(encs.length)linhas.push("ENCAMINHAMENTOS",...encs.map(x=>`- ${x.texto}${x.responsavel?" ("+x.responsavel+")":""}${x.prazo?" · prazo "+dataBR(x.prazo):""}${x.feito?" · concluído":""}`),"");
  linhas.push("Ata completa (pede a senha da plataforma):",linkAta(r),"","Peixoto & Cury Advogados");
  return linhas.join("\n")}
function painelEnvio(r){const dest=destinatarios(r);const env=r.ataEnviadaEm?`Última vez enviada em ${new Date(r.ataEnviadaEm).toLocaleDateString("pt-BR")} por ${esc(nm(r.ataEnviadaPor))}.`:"Ainda não enviada.";
  return`<div class="card" style="border-color:var(--cyan)"><div class="toolbar" style="margin-bottom:10px"><h3 class="grow" style="margin:0">Enviar a ata</h3><span class="nota">${env}</span></div>
    <div class="form">
      <label class="f s6">Para (e-mails separados por ponto e vírgula)<textarea id="env-para" rows="2">${esc(dest.join("; "))}</textarea></label>
      <label class="f s6">Sempre incluir nas atas (vale para todas as reuniões)<span class="toolbar"><input type="text" id="env-fixos" placeholder="Ex.: poliana@peixotoecury.com.br" value="${esc(CFG.emailsFixos||"")}" style="flex:1"><button type="button" class="btn sm" id="env-salvar-fixos">Salvar lista fixa</button></span></label>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button class="btn pri" id="env-outlook">Abrir e-mail no Outlook</button>
      <button class="btn" id="env-copiar">Copiar ata formatada</button>
      <button class="btn" id="env-link">Copiar link da ata</button>
      <span class="nota grow">O e-mail abre com o resumo e o link. Para mandar a ata completa no corpo, use "Copiar ata formatada" e cole no e-mail (Ctrl+V).</span>
    </div></div>`}
async function copiar(texto,html){
  try{if(html&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([texto],{type:"text/plain"})})]);return true}
    await navigator.clipboard.writeText(texto);return true}catch(e){return false}}
function ligarEnvio(r){
  $("env-salvar-fixos").onclick=async()=>{const v=listaEmails($("env-fixos").value).join("; ");try{await db.doc("config/geral").set({...CFG,emailsFixos:v});CFG.emailsFixos=v;toast("Lista fixa salva. Ela entra em todas as atas.");renderReuniao()}catch(e){toast("Não foi possível salvar.")}};
  $("env-outlook").onclick=async()=>{const para=listaEmails($("env-para").value);if(!para.length){toast("Inclua pelo menos um e-mail.");return}
    let corpo=textoAta(r);if(corpo.length>1600)corpo=corpo.slice(0,1400)+"\n[...]\n\nAta completa: "+linkAta(r);
    const url="mailto:"+para.join(";")+"?subject="+encodeURIComponent(`Ata - ${r.titulo} - ${dataBR(r.data)}`)+"&body="+encodeURIComponent(corpo);
    location.href=url;
    try{await db.collection("reunioes").doc(r.id).update({ataEnviadaEm:Date.now(),ataEnviadaPor:meuId})}catch(e){}
    toast("E-mail aberto no Outlook. Confira e envie por lá.")};
  $("env-copiar").onclick=async()=>{const doc=new DOMParser().parseFromString(montarAta(r),"text/html");doc.querySelectorAll("img").forEach(i=>i.remove());
    const html=`<div style="font-family:'Trebuchet MS',sans-serif;color:#0E2841">${doc.body.innerHTML}<p><a href="${linkAta(r)}">Ver a ata na plataforma</a></p></div>`;
    toast(await copiar(textoAta(r),html)?"Ata copiada. Cole no corpo do e-mail com Ctrl+V.":"Não foi possível copiar. Use Baixar ata.")};
  $("env-link").onclick=async()=>{toast(await copiar(linkAta(r))?"Link copiado. Quem abrir precisa da senha da plataforma.":linkAta(r))};
}
// ---------- página da ata (link direto) ----------
function abrirAta(id){V.rid=id;V.tela="ata";assinarReuniao(id);render()}
function renderAtaView(){
  const r=reuniao();if(!r){V.tela="abas";return render()}
  if(!$("ata-frame")){app.innerHTML=`<div class="toolbar"><button class="voltar" id="ata-voltar">← Ir para a plataforma</button><span class="grow"></span><button class="btn sm" id="ata-abrir">Abrir a reunião</button>${downloads?'<button class="btn sm pri" id="ata-baixar">Baixar ata</button>':""}</div>
    <div class="card" style="padding:0;overflow:hidden"><iframe id="ata-frame" title="Ata" style="width:100%;border:0;display:block;min-height:600px;background:#fff"></iframe></div>`;
    $("ata-voltar").onclick=()=>{history.replaceState(null,"",baseUrl());V.tela="abas";render()};
    $("ata-abrir").onclick=()=>{history.replaceState(null,"",baseUrl());abrir(r.id)};
    $("ata-baixar")?.addEventListener("click",baixarAta)}
  const f=$("ata-frame");f.srcdoc=montarAta(r);f.onload=()=>{try{f.style.height=(f.contentDocument.documentElement.scrollHeight+20)+"px"}catch(e){}};
}

// ---------- senha (mesmo padrão das ferramentas LAWgico) ----------
(function(){
  var HASH="e839fc779b442d5393727d7af62bb94e3d892e44906d0f7d603702d01215f0c1";
  async function sha256(m){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
  var ok=false;try{ok=sessionStorage.getItem("pc-reunioes-ok")==="1"}catch(e){}
  function abrir(){document.documentElement.classList.add("gate-open");iniciar()}
  if(ok){abrir();return}
  async function tentar(){var p=document.getElementById("gatePass").value;var h="";try{h=await sha256(p)}catch(e){}
    if(h===HASH){try{sessionStorage.setItem("pc-reunioes-ok","1")}catch(e){}abrir()}else{document.getElementById("gateErr").classList.add("show");document.getElementById("gatePass").select()}}
  document.getElementById("gateBtn").onclick=tentar;
  document.getElementById("gatePass").onkeydown=function(e){if(e.key==="Enter")tentar()};
  document.getElementById("gatePass").focus();
})();
</script>
